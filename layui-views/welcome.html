<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Welcome</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="../layui-admin/layui/css/layui.css" rel="stylesheet">
    <link href="../layui-admin/layui/css/layedit.css" rel="stylesheet">
    <link href="../layui-admin/adminui/css/admin.css" rel="stylesheet">
    <link href="../layui-admin/adminui/css/login.css" rel="stylesheet">
</head>
<body>
<div class="layui-fluid">
    <div class="layui-row layui-col-space5">
        <div class="layui-col-md6">
            <div class="layui-card">
                <div class="layui-card-header">富文本编辑器</div>
                <div class="layui-card-body">
                    <form class="layui-form">
                        <div class="layui-form-item">
                            <textarea id="edit" name="edit" class="layui-hide"></textarea>
                        </div>
                        <div class="layui-form-item">
                            <a class="layui-btn layui-btn-fluid" layadmin-event="submit">提交</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="layui-col-md3">
            <div class="layui-card">
                <div class="layui-card-header">主题信息</div>
                <div class="layui-card-body layui-text layadmin-version">
                    <table class="layui-table">
                        <colgroup>
                            <col width="100">
                            <col>
                        </colgroup>
                        <tbody>
                        <tr>
                            <td>Version</td>
                            <td>
                                <script type="text/html" template>
                                    v{{ layui.admin.v }}
                                </script>
                            </td>
                        </tr>
                        <tr>
                            <td>Layui</td>
                            <td>
                                <script type="text/html" template>
                                    v{{ layui.v }}
                                </script>
                            </td>
                        </tr>
                        <tr>
                            <td>LayIM</td>
                            <td id="LayIM">
                                v{{ layui.layim.v }}
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../layui-admin/layui/layui.js"></script>
<script>
    layui.config({
        base: '../layui-admin/'
        , version: true
    }).config({
        layimPath: layui.cache.base + 'modules/layim/',
        layimResPath: layui.cache.base + 'modules/layim/res/'
    }).use(['index', 'layedit', 'layim'], function () {

        const edit = layui.layedit.build('edit', {
            height: 280
            , uploadImage: {
                url: 'json/upload.json'
            }
            , type: 'get'
        });

        layui.admin.events.submit = function () {
            alert(layui.layedit.getContent(edit));
        };

        layui.$('#LayIM').html(layui.laytpl(layui.$('#LayIM').html()).render({}));
        layui.layim.config({
            contactsPanel: false
            , init: {
                //url: 'json/im-config.json'
                user: {
                    username: '我'
                    , id: 'user-100001'
                    , avatar: 'https://gitee.com/favicon.ico'
                }
            }
            , uploadImage: {url: 'json/upload.json'}
        });

        layui.util.fixbar({
            default: false
            , bars: [{type: 'AI', content: 'AI'}]
            , on: {
                click: function () {
                    layui.layim.chat({
                        type: 'ai'
                        , username: 'AI'
                        , id: 'ai-100001'
                        , avatar: 'https://gitee.com/favicon.ico'
                        , new: true // 始终创建新的聊天面板
                        , enableLocalChatlog: false
                    });
                }
            }
        });

        layui.layim.callback('contentParser', function (data) {
            console.log('contentParser', data);
            return data;
        });

        layui.layim.on('sendMessage', function (data) {
            console.log(data);
            const user = data.user; // 当前用户的数据（即我）,包含了消息内容。
            const receiver = data.receiver; // 当前聊天对象的数据（即 AI）

            if (receiver.type === 'ai') {
                const rid = receiver.id;
                const messages = layui.layim.chat.messages = layui.layim.chat.messages || {[rid]: []};
                messages[rid] = messages[rid] || []
                messages[rid]?.push({role: 'user', content: user.content});

                console.log('sendMessage', messages);

                let i = 0, msg = ['测试'];
                layui.layim.getMessage({...receiver, content: msg.join(''), finished: false});

                let stream = setInterval(function () {
                    msg.push(`，测试${i++}`);
                    if (i === 5) {
                        msg.push(`，测试。`);
                        clearInterval(stream);
                        layui.layim.getMessage({...receiver, content: msg.join(''), finished: true});
                    } else {
                        layui.layim.getMessage({...receiver, content: msg.join(''), finished: false});
                    }
                }, 1000);
            }
        });

        layui.layim.on('chatInit', function (obj) {
            const data = obj.data, elem = obj.elem;
            if (data.type === 'ai') {
                // 每次刷新页面，即提示为新的对话
                const lastItem = elem.find('.layim-chat-main>ul>li').last();
                const existMessages = layui.layim.chat.messages && layui.layim.chat.messages[data.id];
                if (!existMessages && !lastItem.hasClass('layim-chat-system')) {
                    layui.layim.getMessage({
                        system: true
                        , id: data.id
                        , type: 'ai'
                        , content: '以下为新的对话'
                        // ,saveLocalChatlog: true // 是否将该消息保存到本地的聊天记录
                    });
                }
            }
        });

    });
</script>
</body>
</html>
